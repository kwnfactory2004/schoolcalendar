<body class="min-h-screen flex flex-col pb-12 select-none">

    <!-- Header -->
    <header class="bg-deepgreen-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-white text-deepgreen-600 font-bold rounded-lg flex items-center justify-center text-lg shadow-sm">
                    4A
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">時間割</h1>
                    <p class="text-xs text-deepgreen-100">4Aクラス スケジュール確認</p>
                </div>
            </div>
            <div id="today-badge" class="text-xs bg-deepgreen-700/80 px-2.5 py-1 rounded-full text-deepgreen-100 border border-deepgreen-500">
                <!-- 今日: YYYY/MM/DD -->
            </div>
        </div>
        
        <!-- Navigation Tabs -->
        <div class="max-w-5xl mx-auto px-4 flex border-t border-deepgreen-500/50">
            <button onclick="switchTab('daily')" id="tab-daily" class="flex-1 py-2.5 text-center text-sm font-semibold border-b-2 border-white text-white transition-colors">

            ...[1,2,3,4,5,6,7].map(p => ({ date: "2027-03-08", period: p, title: "1級対策", category: "normal" })),
            // 3/9 (1-3コマ 卒業試験 14)
            ...[1,2,3].map(p => ({ date: "2027-03-09", period: p, title: "卒業試験 14", category: "exam" })),
            // 3/10 - 3/13 (1-4コマ 1級対策)
            ...["2027-03-10", "2027-03-11", "2027-03-12", "2027-03-13"].flatMap(d => [1,2,3,4].map(p => ({ date: d, period: p, title: "1級対策", category: "normal" }))),
            // 3/14 (登録試験 1-6コマ想定)
            ...[1,2,3,4,5,6].map(p => ({ date: "2027-03-14", period: p, title: "登録試験", category: "exam" })),
            // 3/16 (1-3コマ 卒業式準備)
            ...[1,2,3].map(p => ({ date: "2027-03-16", period: p, title: "卒業式準備", category: "event" })),
            // 3/17 (1-3コマ 卒業式)
            ...[1,2,3].map(p => ({ date: "2027-03-17", period: p, title: "卒業式", category: "event" }))
        ];

        // --- 2.5 持ち物データ (belongings) ---
        const belongingsData = {
            "2026-09-07": ["テキスト：エンジン電子制御装置", "筆記用具", "電卓"],
            "2026-09-08": ["テキスト：エンジン電子制御装置", "筆記用具", "電卓"],
            "2026-09-09": ["テキスト：エンジン電子制御装置", "筆記用具", "電卓"],
            "2026-09-10": ["テキスト：エンジン電子制御装置", "筆記用具", "電卓"],
            "2026-09-14": ["テキスト：エンジン電子制御装置", "筆記用具", "電卓"],
            "2026-09-15": ["テキスト：エンジン電子制御装置", "筆記用具", "電卓"],
            "2026-09-16": ["テキスト：エンジン電子制御装置", "筆記用具", "電卓"],
            "2026-09-17": ["テキスト：エンジン電子制御装置", "筆記用具", "電卓"]
        };

        // --- 3. アプリ状態管理 ---
        let currentTab = 'daily';
        let currentDate = new Date();

        const categoryStyles = {
            normal: { bg: 'bg-emerald-50 border-emerald-200 text-emerald-900', badge: 'bg-emerald-600 text-white', label: '通常授業' },
            exam: { bg: 'bg-rose-50 border-rose-200 text-rose-900', badge: 'bg-rose-600 text-white', label: '試験' },
            oral: { bg: 'bg-amber-50 border-amber-200 text-amber-900', badge: 'bg-amber-600 text-white', label: '口述対策' },
            event: { bg: 'bg-sky-50 border-sky-200 text-sky-900', badge: 'bg-sky-600 text-white', label: '行事' },
            holiday: { bg: 'bg-red-50 border-red-200 text-red-900', badge: 'bg-red-600 text-white', label: '祝日' },
            school_off: { bg: 'bg-purple-50 border-purple-200 text-purple-900', badge: 'bg-purple-600 text-white', label: '学校休み' },
            empty: { bg: 'bg-slate-50 border-slate-200 text-slate-400', badge: 'bg-slate-300 text-slate-600', label: '授業なし' }
        };

        // --- 4. ユーティリティ関数 ---
        function formatDateStr(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // "YYYY-MM-DD" を端末のタイムゾーンの0時として読む
        function parseDateStr(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function isSameDay(a, b) {
            return formatDateStr(a) === formatDateStr(b);
        }

        function getDayOfWeekStr(date) {
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            return days[date.getDay()];
        }

        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function isWinterBreak(dateStr) {
            return dateStr >= "2026-12-25" && dateStr <= "2027-01-06";
        }

        function getDayInfo(dateObj) {
            const dateStr = formatDateStr(dateObj);
            const dayOfWeek = dateObj.getDay();
            const holidayName = holidaysData[dateStr] || null;
            const dayEvents = eventsData.filter(e => e.date === dateStr);
            const belongings = belongingsData[dateStr] || [];
            const hasClass = dayEvents.length > 0;
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

            let statusType = 'class';
            let statusLabel = '';

            const isWinter = isWinterBreak(dateStr);

            if (hasClass) {
                statusType = 'class';
            } else if (holidayName) {
                statusType = 'holiday';
                statusLabel = holidayName;
            } else if (isWinter) {
                statusType = 'winter_break';
                statusLabel = '冬休み';
            } else if (!isWeekend) {
                statusType = 'school_off';
                statusLabel = '学校休み';
            } else {
                statusType = 'weekend';
                statusLabel = '休日';
            }

            return {
                dateStr,
                holidayName,
                dayEvents,
                belongings,
                hasClass,
                isWeekend,
                statusType,
                statusLabel
            };
        }

        // --- 5. タブ切り替え ---
        function switchTab(tab) {
            currentTab = tab;
            ['daily', 'weekly', 'monthly'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.classList.add('border-white', 'text-white');
                    btn.classList.remove('border-transparent', 'text-deepgreen-200');
                    view.classList.remove('hidden');
                } else {
                    btn.classList.remove('border-white', 'text-white');
                    btn.classList.add('border-transparent', 'text-deepgreen-200');
                    view.classList.add('hidden');
                }
            });
            render();
        }

        // --- 6. ナビゲーション ---
        function navigateDate(delta) {
            if (currentTab === 'daily') {
                currentDate.setDate(currentDate.getDate() + delta);
            } else if (currentTab === 'weekly') {
                currentDate.setDate(currentDate.getDate() + (delta * 7));
            } else if (currentTab === 'monthly') {
                // 31日→翌月のように存在しない日に飛ばないよう、月末に丸める
                const y = currentDate.getFullYear();
                const m = currentDate.getMonth() + delta;
                const lastDay = new Date(y, m + 1, 0).getDate();
                const today = new Date();
                const target = new Date(y, m, Math.min(currentDate.getDate(), lastDay));
                // 今日の月に戻ってきたときは今日に合わせる
                currentDate = (target.getFullYear() === today.getFullYear() && target.getMonth() === today.getMonth())
                    ? today : target;
            }
            render();
        }

        function resetToToday() {
            currentDate = new Date();
            render();
        }

        function jumpToDate(dateStr) {
            currentDate = parseDateStr(dateStr);
            switchTab('daily');
        }

        // --- 7. レンダリング主処理 ---
        function render() {
            const today = new Date();
            document.getElementById('today-badge').textContent = `本日: ${today.getMonth() + 1}/${today.getDate()} (${getDayOfWeekStr(today)})`;

            if (currentTab === 'daily') {
                renderDaily();
            } else if (currentTab === 'weekly') {
                renderWeekly();
            } else if (currentTab === 'monthly') {
                renderMonthly();
            }
        }

        // --- 8. 日別ビュー描画 ---
        function renderDaily() {
            const dateStr = formatDateStr(currentDate);
            const dayOfWeek = getDayOfWeekStr(currentDate);
            const dayInfo = getDayInfo(currentDate);
            
            let subTitle = ` (${dayOfWeek})`;
            if (dayInfo.holidayName) {
                subTitle += ` - ${dayInfo.holidayName}`;
            } else if (dayInfo.statusType === 'school_off') {
                subTitle += ` - 学校休み`;
            }
            
            document.getElementById('date-display-title').textContent = 
                `${currentDate.getFullYear()}年${currentDate.getMonth() + 1}月${currentDate.getDate()}日` + subTitle;

            const container = document.getElementById('view-daily');
            container.innerHTML = '';
            const dayWord = isSameDay(currentDate, new Date()) ? '本日' : 'この日';

            // --- 持ち物バナーの追加 ---
            if (dayInfo.belongings && dayInfo.belongings.length > 0) {
                let itemsListHtml = dayInfo.belongings.map(item => `
                    <li class="flex items-center text-sm text-slate-700 py-0.5">
                        <svg class="w-4 h-4 mr-2 text-deepgreen-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        <span>${item}</span>
                    </li>
                `).join('');

                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-4 border-l-4 border-l-deepgreen-500">
                        <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 flex items-center">
                            <svg class="w-4 h-4 text-deepgreen-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                            </svg>
                            <span class="text-sm font-bold text-slate-800">${dayWord}の持ち物・準備物</span>
                        </div>
                        <div class="p-3">
                            <ul class="space-y-1">
                                ${itemsListHtml}
                            </ul>
                        </div>
                    </div>
                `;
            }

            if (!dayInfo.hasClass) {
                let offBadgeColor = "bg-purple-100 text-purple-800 border-purple-200";
                let offTitle = "学校休み";
                let offDesc = `${dayWord}は学校が休みです。`;

                if (dayInfo.holidayName) {
                    offBadgeColor = "bg-red-100 text-red-800 border-red-200";
                    offTitle = `祝日 (${dayInfo.holidayName})`;
                    offDesc = `${dayWord}は祝日のため学校休みです。`;
                } else if (dayInfo.statusType === 'winter_break') {
                    offBadgeColor = "bg-blue-100 text-blue-800 border-blue-200";
                    offTitle = "冬休み";
                    offDesc = "冬期休業期間中のため授業はありません。";
                } else if (dayInfo.isWeekend) {
                    offBadgeColor = "bg-slate-100 text-slate-700 border-slate-200";
                    offTitle = "週末休日";
                    offDesc = `${dayWord}は土日のため授業はありません。`;
                }

                container.innerHTML += `
                    <div class="p-4 mb-3 rounded-xl border ${offBadgeColor} flex items-center justify-between shadow-sm">
                        <div>
                            <div class="text-base font-bold">${offTitle}</div>
                            <div class="text-xs opacity-80 mt-0.5">${offDesc}</div>
                        </div>
                        <span class="px-2.5 py-1 text-xs font-bold rounded-full bg-white/80 border">
                            ${offTitle}
                        </span>
                    </div>
                `;
            }

            const dayEvents = dayInfo.dayEvents;

            periods.forEach(p => {
                if (p.num === 'lunch') {
                    container.innerHTML += `
                        <div class="bg-slate-100/80 rounded-lg p-2.5 text-center text-xs font-semibold text-slate-500 border border-slate-200 my-2">
                            昼休憩 (12:00〜12:50)
                        </div>
                    `;
                    return;
                }

                const ev = dayEvents.find(e => e.period === p.num);
                let style = categoryStyles.empty;
                let emptyText = '授業なし';

                if (ev) {
                    style = categoryStyles[ev.category] || categoryStyles.normal;
                } else if (dayInfo.statusType === 'winter_break') {
                    style = { bg: 'bg-blue-50 border-blue-200 text-blue-900', badge: 'bg-blue-600 text-white', label: '冬休み' };
                    emptyText = '冬休み';
                } else if (dayInfo.statusType === 'school_off') {
                    style = categoryStyles.school_off;
                    emptyText = '学校休み';
                } else if (dayInfo.statusType === 'holiday') {
                    style = categoryStyles.holiday;
                    emptyText = `祝日 (${dayInfo.holidayName})`;
                }

                container.innerHTML += `
                    <div class="bg-white rounded-xl p-3 mb-2 shadow-sm border ${ev ? style.bg : 'border-slate-200'} flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="text-center w-16 flex-shrink-0">
                                <div class="text-xs font-bold text-slate-700">${p.name}</div>
                                <div class="text-[10px] text-slate-500">${p.time.replace('〜', ' - ')}</div>
                            </div>
                            <div class="h-8 w-px bg-slate-200"></div>
                            <div>
                                <div class="text-sm font-bold ${ev ? 'text-slate-800' : 'text-slate-400'}">
                                    ${ev ? ev.title : emptyText}
                                </div>
                            </div>
                        </div>
                        ${ev ? `<span class="px-2.5 py-1 text-xs font-bold rounded-full ${style.badge}">${style.label}</span>` : ''}
                    </div>
                `;
            });
        }

        // --- 9. 週別ビュー描画 ---
        function renderWeekly() {
            const monday = getMonday(currentDate);
            const sunday = new Date(monday);
            sunday.setDate(sunday.getDate() + 6);

            const thisWeek = isSameDay(monday, getMonday(new Date()));
            document.getElementById('date-display-title').textContent = 
                `${monday.getMonth() + 1}/${monday.getDate()} - ${sunday.getMonth() + 1}/${sunday.getDate()}` + (thisWeek ? ' (今週)' : '');

            const container = document.getElementById('view-weekly');
            container.innerHTML = '';

            const weekDates = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(monday);
                d.setDate(d.getDate() + i);
                return d;
            });

            const todayStr = formatDateStr(new Date());

            weekDates.forEach(d => {
                const dStr = formatDateStr(d);
                const dayName = getDayOfWeekStr(d);
                const isToday = dStr === todayStr;
                const dayInfo = getDayInfo(d);

                let headerBg = "bg-slate-100 text-slate-800 border-slate-200";
                let dayBadge = "";

                if (isToday) {
                    headerBg = "bg-deepgreen-600 text-white border-deepgreen-700";
                    dayBadge = `<span class="ml-2 px-2 py-0.5 text-[10px] bg-white text-deepgreen-700 font-bold rounded-full">今日</span>`;
                } else if (dayInfo.holidayName) {
                    headerBg = "bg-red-50 text-red-800 border-red-200";
                } else if (dayInfo.statusType === 'winter_break') {
                    headerBg = "bg-blue-50 text-blue-800 border-blue-200";
                } else if (dayInfo.statusType === 'school_off') {
                    headerBg = "bg-purple-50 text-purple-800 border-purple-200";
                }

                let subNote = "";
                if (dayInfo.holidayName) {
                    subNote = `<span class="text-xs font-normal text-red-600 ml-auto">${dayInfo.holidayName}</span>`;
                } else if (dayInfo.statusType === 'winter_break') {
                    subNote = `<span class="text-xs font-normal text-blue-600 ml-auto">冬休み</span>`;
                } else if (dayInfo.statusType === 'school_off') {
                    subNote = `<span class="text-xs font-normal text-purple-600 ml-auto">学校休み</span>`;
                } else if (dayInfo.isWeekend && !dayInfo.hasClass) {
                    subNote = `<span class="text-xs font-normal text-slate-500 ml-auto">休日</span>`;
                }

                let dayCardHtml = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-3">
                        <div onclick="jumpToDate('${dStr}')" class="px-3 py-2.5 flex items-center justify-between border-b ${headerBg} cursor-pointer">
                            <div class="flex items-center">
                                <span class="text-base font-bold">${d.getMonth() + 1}/${d.getDate()} (${dayName})</span>
                                ${dayBadge}
                            </div>
                            ${subNote}
                        </div>
                        <div class="p-2 divide-y divide-slate-100 text-xs">
                `;

                if (!dayInfo.hasClass) {
                    let textMsg = "授業なし";
                    if (dayInfo.holidayName) textMsg = `祝日 (${dayInfo.holidayName})`;
                    else if (dayInfo.statusType === 'winter_break') textMsg = "冬休み";
                    else if (dayInfo.statusType === 'school_off') textMsg = "学校休み";
                    else if (dayInfo.isWeekend) textMsg = "土日休校";

                    dayCardHtml += `
                        <div class="py-2 text-center text-slate-400 font-medium">
                            ${textMsg}
                        </div>
                    `;
                } else {
                    periods.forEach(p => {
                        if (p.num === 'lunch') return;

                        const ev = dayInfo.dayEvents.find(e => e.period === p.num);
                        if (ev) {
                            const style = categoryStyles[ev.category] || categoryStyles.normal;
                            dayCardHtml += `
                                <div class="py-1.5 flex items-center justify-between">
                                    <div class="flex items-center space-x-2">
                                        <span class="w-12 text-[11px] font-semibold text-slate-500">${p.num}コマ</span>
                                        <span class="font-bold text-slate-800">${ev.title}</span>
                                    </div>
                                    <span class="text-[9px] px-1.5 py-0.5 rounded font-bold ${style.badge}">
                                        ${style.label}
                                    </span>
                                </div>
                            `;
                        }
                    });
                }

                dayCardHtml += `
                        </div>
                    </div>
                `;

                container.innerHTML += dayCardHtml;
            });
        }

        // --- 10. 月別ビュー描画 ---
        function renderMonthly() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('date-display-title').textContent = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDayOfWeek = firstDay.getDay();
            const totalDays = lastDay.getDate();

            const grid = document.getElementById('monthly-grid');
            grid.innerHTML = '';

            for (let i = 0; i < startDayOfWeek; i++) {
                grid.innerHTML += `<div class="bg-slate-50 border border-slate-100 rounded h-14 p-0.5 opacity-30"></div>`;
            }

            const todayStr = formatDateStr(new Date());

            for (let day = 1; day <= totalDays; day++) {
                const dateObj = new Date(year, month, day);
                const dayInfo = getDayInfo(dateObj);
                const isToday = dayInfo.dateStr === todayStr;

                const dayEvs = dayInfo.dayEvents;
                const categories = [...new Set(dayEvs.map(e => e.category))];

                let eventBadgeHtml = '';
                if (dayEvs.length > 0) {
                    if (categories.includes('exam')) {
                        eventBadgeHtml += `<div class="bg-rose-500 text-white text-[8px] px-0.5 py-0.5 rounded truncate text-center font-bold">試験</div>`;
                    } else if (categories.includes('oral')) {
                        eventBadgeHtml += `<div class="bg-amber-500 text-white text-[8px] px-0.5 py-0.5 rounded truncate text-center font-bold">口述</div>`;
                    } else if (categories.includes('event')) {
                        eventBadgeHtml += `<div class="bg-sky-500 text-white text-[8px] px-0.5 py-0.5 rounded truncate text-center font-bold">行事</div>`;
                    } else {
                        eventBadgeHtml += `<div class="bg-emerald-600 text-white text-[8px] px-0.5 py-0.5 rounded truncate text-center font-bold">授業</div>`;
                    }
                } else if (dayInfo.statusType === 'holiday') {
                    eventBadgeHtml += `<div class="bg-red-500 text-white text-[8px] px-0.5 py-0.5 rounded truncate text-center font-bold">祝日</div>`;
                } else if (dayInfo.statusType === 'winter_break') {
                    eventBadgeHtml += `<div class="bg-blue-500 text-white text-[8px] px-0.5 py-0.5 rounded truncate text-center font-bold">冬休</div>`;
                } else if (dayInfo.statusType === 'school_off') {
                    eventBadgeHtml += `<div class="bg-purple-600 text-white text-[8px] px-0.5 py-0.5 rounded truncate text-center font-bold">休み</div>`;
                }

                grid.innerHTML += `
                    <div onclick="jumpToDate('${dayInfo.dateStr}')" 
                         class="bg-white border ${isToday ? 'border-deepgreen-600 ring-2 ring-deepgreen-500/30' : 'border-slate-200'} rounded h-14 p-1 flex flex-col justify-between cursor-pointer active:bg-slate-50 transition shadow-sm overflow-hidden">
                        <div class="flex justify-between items-start">
                            <span class="text-[11px] font-bold leading-none ${isToday ? 'bg-deepgreen-600 text-white w-4 h-4 rounded-full flex items-center justify-center text-[9px]' : (dayInfo.holidayName || dateObj.getDay() === 0 ? 'text-red-500' : (dateObj.getDay() === 6 ? 'text-blue-500' : 'text-slate-700'))}">
                                ${day}
                            </span>
                        </div>
                        <div class="w-full">
                            ${eventBadgeHtml}
                        </div>
                    </div>
                `;
            }
        }

        // 初期化実行
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });

        // 開きっぱなしで日付をまたいだときに「今日」の表示を更新する
        let lastRenderDay = formatDateStr(new Date());
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            const nowDay = formatDateStr(new Date());
            if (nowDay !== lastRenderDay) {
                lastRenderDay = nowDay;
                currentDate = new Date();
                render();
            }
        });
    </script>
</body>
</html>
