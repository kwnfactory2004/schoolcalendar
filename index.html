<html lang="ja">

<style>
:root{
  --g:#0F382C; --g2:#1d5a47; --g3:#3f6e5c; --g4:#9fc4b4; --g5:#cfe4da;
  --bg:#f4f7f5; --card:#fff; --line:#dfe6e2; --ink:#10281f; --sub:#5f7a6e;
  --c-normal:#1f7a5a; --c-exam:#c0394b; --c-oral:#b7791f; --c-event:#2b7bb0;
  --c-holiday:#c24141; --c-off:#7c5cb0; --c-winter:#3b6fc4; --c-none:#8fa398;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:48px;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.dt{display:inline-block;vertical-align:middle;flex:none}
.wrap{max-width:880px;margin:0 auto;padding:0 14px}

/* ヘッダー */
header{position:sticky;top:0;z-index:30;background:var(--g);color:#fff;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.6px);background-size:10px 10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:13px;background:#fff;color:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.brand .t2{margin-top:7px;color:var(--g4)}
.today{border:1px solid var(--g3);border-radius:999px;padding:6px 13px;color:var(--g5);display:flex;align-items:center;gap:7px;flex:none}
.today i{width:6px;height:6px;border-radius:50%;background:#7be0b4;display:block}
.tabs{display:flex;gap:6px}
.tab{padding:10px 20px;border-radius:13px 13px 0 0;font-size:14px;font-weight:600;color:var(--g4);transition:color .15s}
.tab:hover{color:#fff}
.tab.on{background:var(--bg);color:var(--g)}

/* 日付ナビ */
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 14px}
.nbtn{width:40px;height:40px;border-radius:50%;border:1px solid #cdd8d2;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s,border-color .15s}
.nbtn:hover{background:#eef3f0;border-color:var(--g3)}
.nbtn svg{width:18px;height:18px}
.ntitle{text-align:center;min-width:0}
.ntitle .l1{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--g)}
.ntitle .l1 b{font-size:15px;font-weight:700}
.ntitle .l1 em{font-style:normal;font-size:12px;color:var(--c-holiday);font-weight:600}
.ntitle .l2{margin-top:7px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:10px}
.tobtn{color:var(--g);border:1px solid var(--g4);border-radius:999px;padding:3px 11px;font-size:11px;font-weight:600}
.tobtn:hover{background:var(--g);color:#fff}

/* タイル */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.tile,.dcard{animation:none}}
.tile.past{opacity:.55}
.tile.next{border-color:var(--g3);box-shadow:0 0 0 3px rgba(31,122,90,.12)}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;color:var(--g)}
.tile.past .top{color:var(--g4)}
.ttl{font-size:15px;font-weight:700;line-height:1.35;word-break:break-all}
.tm{color:var(--sub)}
.tile.none .ttl{color:#9fb0a7;font-weight:500}
.pill{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;padding:5px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);white-space:nowrap}
.c-normal{--c:var(--c-normal)}.c-exam{--c:var(--c-exam)}.c-oral{--c:var(--c-oral)}.c-event{--c:var(--c-event)}
.c-holiday{--c:var(--c-holiday)}.c-off{--c:var(--c-off)}.c-winter{--c:var(--c-winter)}.c-none{--c:var(--c-none)}
.tile.cat{border-top:3px solid var(--c)}
.span2{grid-column:span 2}
.full{grid-column:1/-1}

.hero{background:var(--g);color:#fff;border-color:var(--g);background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.6px);background-size:10px 10px;gap:10px}
.hero .top{color:var(--g4)}
.hero .row{display:flex;align-items:center;gap:14px}
.hero .ttl{font-size:21px;color:#fff}
.hero .tm{color:var(--g5)}
.bar{display:flex;gap:3px}
.bar span{flex:1;height:6px;border-radius:3px;background:var(--g3)}
.bar span.f{background:#fff}
.hero .pill{background:rgba(255,255,255,.16);color:#fff}

.lunch{background:transparent;border:1px dashed var(--g4);flex-direction:row;align-items:center;justify-content:center;gap:10px;color:var(--sub);padding:9px}
.note{border:1px dashed var(--g4);background:#fff}
.note h3{display:flex;align-items:center;gap:10px;color:var(--g)}
.note h3 span{font-size:13px;font-weight:700}
.note ul{list-style:none;display:grid;gap:6px;margin-top:2px}
.note li{display:flex;gap:9px;font-size:13.5px;align-items:flex-start}
.note li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--g2);margin-top:7px;flex:none}
.off{flex-direction:row;align-items:center;justify-content:space-between;padding:18px;gap:14px}
.off b{font-size:17px;display:block}
.off small{font-size:12.5px;color:var(--sub);display:block;margin-top:3px}

/* 週 */
.wk{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:720px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:rise .45s both}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;background:#eef3f0;color:var(--g)}
.dh .l{display:flex;align-items:center;gap:8px}
.dh .l b{font-size:13px}
.dh .r{font-size:11.5px;font-weight:600;color:var(--sub)}
.dcard.is-today .dh{background:var(--g);color:#fff;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.6px);background-size:10px 10px}
.dcard.is-today .dh .r{color:var(--g5)}
.dcard.hol .dh .r{color:var(--c-holiday)}
.dcard.is-today.hol .dh .r{color:#ffd3d3}
.dbody{padding:4px 14px 8px}
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #edf1ef}
.pr:first-child{border-top:0}
.pr .n{width:18px;color:var(--g2);display:flex;justify-content:center}
.pr .x{flex:1;font-size:13.5px;font-weight:600;min-width:0;word-break:break-all}
.empty{padding:14px 0;text-align:center;color:#9fb0a7;font-size:13px;font-weight:500}

/* 月 */
.mon{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding-bottom:8px;border-bottom:1px solid var(--line)}
.dows .su{color:var(--c-holiday)}.dows .sa{color:var(--c-event)}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding-top:8px}
.cell{border:1px solid var(--line);border-radius:12px;min-height:62px;padding:5px 5px 4px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;cursor:pointer;background:#fff;color:var(--ink);overflow:hidden;transition:border-color .15s,background .15s}
.cell:hover{border-color:var(--g3);background:#f6faf8}
.cell.blank{background:transparent;border-color:transparent;cursor:default}
.cell.sun,.cell.hol{color:var(--c-holiday)}
.cell.sat{color:var(--c-event)}
.cell.today{background:var(--g);color:#fff;border-color:var(--g)}
.tag{display:block;text-align:center;font-size:9.5px;font-weight:700;line-height:1;padding:4px 1px;border-radius:6px;color:#fff;background:var(--c);overflow:hidden;white-space:nowrap}
.cell.today .tag{background:#fff;color:var(--g)}
.legend{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px}
/* 行程タイムライン(特別日) */
.tlist{display:flex;flex-direction:column;margin-top:2px}
.tl{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf1ef}
.tl:first-child{border-top:0}
.tl .tt{color:var(--g2);display:flex;flex-direction:column;gap:3px}
.tl .ttl{font-size:14.5px}
.tl .tn{font-size:12px;color:var(--sub);margin-top:3px}
.tl.past{opacity:.5}
.tl.next{background:rgba(31,122,90,.07);border-radius:12px;padding-left:8px;padding-right:8px;margin:0 -8px}
.tl.now{background:var(--g);color:#fff;border-radius:12px;padding-left:10px;padding-right:10px;margin:0 -10px;border-top-color:transparent}
.tl.now .tt,.tl.now .tn{color:var(--g5)}
.tl.now .pill{background:rgba(255,255,255,.18);color:#fff}
@media(max-width:420px){.tl{grid-template-columns:70px minmax(0,1fr);}.tl .pill{grid-column:2;justify-self:start}}
.hidden{display:none!important}
/* ホーム画面から起動したとき、ノッチ・ホームバーに被らないようにする */
header{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
</style>
</head>

<header>

<main class="wrap">

    </div>
    <button class="nbtn" id="next-btn" onclick="navigateDate(1)" aria-label="次へ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <section id="view-daily" class="grid"></section>
  <section id="view-weekly" class="wk hidden"></section>
  <section id="view-monthly" class="hidden">
    <div class="mon">
      <div class="dows"><div class="su">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sa">土</div></div>

    </div>
  </section>
</main>

                statusLabel = holidayName;
            } else if (isWinterBreak(dateStr)) {
                statusType = 'winter_break';
                statusLabel = '冬休み';
            } else if (!isWeekend) {
                statusType = 'school_off';
                statusLabel = '学校休み';
            } else {
                statusType = 'weekend';
                statusLabel = '休日';
            }

            return { dateStr, holidayName, dayEvents, belongings, special, hasClass, isWeekend, statusType, statusLabel };
        }

        // "9:10〜10:00" → [開始分, 終了分]
        function periodRange(p) {
            const [a, b] = p.time.split('〜').map(s => {
                const [h, m] = s.split(':').map(Number);
                return h * 60 + m;
            });
            return [a, b];
        }
        const el = id => document.getElementById(id);
        const delay = i => `style="animation-delay:${Math.min(i, 14) * 35}ms"`;

        // --- 6. タブ切り替え ---
        function switchTab(tab) {
            currentTab = tab;
            ['daily', 'weekly', 'monthly'].forEach(t => {
                el(`tab-${t}`).classList.toggle('on', t === tab);
                el(`view-${t}`).classList.toggle('hidden', t !== tab);
            });
            render();
        }

        // --- 7. ナビゲーション ---
        function navigateDate(delta) {
            if (currentTab === 'daily') {
                currentDate.setDate(currentDate.getDate() + delta);
            } else if (currentTab === 'weekly') {
                currentDate.setDate(currentDate.getDate() + (delta * 7));
            } else if (currentTab === 'monthly') {
                // 31日→翌月のように存在しない日に飛ばないよう、月末に丸める
                const y = currentDate.getFullYear();
                const m = currentDate.getMonth() + delta;
                const lastDay = new Date(y, m + 1, 0).getDate();
                const today = new Date();
                const target = new Date(y, m, Math.min(currentDate.getDate(), lastDay));
                // 今日の月に戻ってきたときは今日に合わせる
                currentDate = (target.getFullYear() === today.getFullYear() && target.getMonth() === today.getMonth())
                    ? today : target;
            }
            render();
        }

        function resetToToday() {
            currentDate = new Date();
            render();
        }

        function jumpToDate(dateStr) {
            currentDate = parseDateStr(dateStr);
            switchTab('daily');
        }

        // --- 8. レンダリング主処理 ---
        function render() {
            const today = new Date();
            el('today-badge').innerHTML = dot(`${today.getMonth() + 1}/${today.getDate()} ${WEEK_EN[today.getDay()]}`, 10);
            el('logo').innerHTML = dot('4A', 18);
            el('brand1').innerHTML = dot('TIMEGRID', 22);
            el('brand2').innerHTML = dot('CLASS 4A / SCHEDULE', 10);

            if (currentTab === 'daily') renderDaily();
            else if (currentTab === 'weekly') renderWeekly();
            else renderMonthly();
        }

        // --- 天気(Open-Meteo・無料・キー不要。失敗しても画面は変えない) ---
        function wxText(c) {
            if (c === 0) return '快晴'; if (c <= 3) return '晴れ〜くもり'; if (c <= 48) return '霧・くもり';
            if (c <= 57) return '霧雨'; if (c <= 67) return '雨'; if (c <= 77) return '雪'; if (c <= 82) return 'にわか雨'; return '雷雨';
        }
        function loadWeather(w, dateStr) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&start_date=${dateStr}&end_date=${dateStr}`;
            fetch(url).then(r => r.json()).then(j => {
                const d = j.daily, node = document.getElementById('wx-line');
                if (!d || !node) return;
                const hi = Math.round(d.temperature_2m_max[0]), lo = Math.round(d.temperature_2m_min[0]);
                const p = d.precipitation_probability_max[0];
                node.textContent = `${w.name}：${wxText(d.weather_code[0])}　${lo}〜${hi}℃　雨 ${p}%` + (lo <= 10 ? '　寒いので上着を' : '');
            }).catch(() => {
                const node = document.getElementById('wx-line');
                if (node) node.textContent = `${w.name}の天気は読み込めませんでした`;
            });
        }

        // --- 9. 日別ビュー描画 ---
        function renderDaily() {
            const now = new Date();
            const isToday = isSameDay(currentDate, now);
            const dayInfo = getDayInfo(currentDate);
            const dow = getDayOfWeekStr(currentDate);

            let sub = '';
            if (dayInfo.holidayName) sub = `<em>${dayInfo.holidayName}</em>`;
            else if (dayInfo.statusType === 'school_off') sub = `<em>学校休み</em>`;
            el('date-display-title').innerHTML =
                `${dot(`${currentDate.getFullYear()}.${currentDate.getMonth() + 1}.${currentDate.getDate()}`, 22)}<b>（${dow}）</b>${sub}`;
            const nClass = new Set(dayInfo.dayEvents.map(e => e.period)).size;
            el('date-sub').innerHTML = dot(`${isToday ? 'TODAY - ' : ''}${dayInfo.special ? 'TRIP' : (nClass ? nClass + ' CLASSES' : 'NO CLASS')}`, 10);

            const container = el('view-daily');
            let html = '';
            let idx = 0;
            const dayWord = isToday ? '本日' : 'この日';

            // 特別日:行程タイムライン
            if (dayInfo.special) {
                const sp = dayInfo.special;
                const nowMin0 = now.getHours() * 60 + now.getMinutes();
                const ranges = stopRanges(sp.stops);
                let nextDone = false;
                const rows = sp.stops.map((st, i) => {
                    const [s, e] = ranges[i];
                    const k = kindStyles[st.kind] || kindStyles.move;
                    const running = isToday && nowMin0 >= s && nowMin0 < e;
                    const past = isToday && nowMin0 >= e;
                    const isNext = isToday && !running && !past && !nextDone;
                    if (isNext) nextDone = true;
                    return `<div class="tl ${k.cls} ${running ? 'now' : ''} ${past ? 'past' : ''} ${isNext ? 'next' : ''}">
                        <div class="tt">${st.t.split('〜').map((x, j) => `<div>${dot((j ? '-' : '') + x, 11)}</div>`).join('')}</div>
                        <div class="tb"><div class="ttl">${st.label}</div>${st.note ? `<div class="tn">${st.note}</div>` : ''}${st.shops ? `<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12.5px;font-weight:700">おすすめ店を見る（${st.shops.length - 1}店）</summary><ul style="list-style:none;display:grid;gap:5px;margin-top:6px;font-size:12.5px">${st.shops.map(x => `<li>${x}</li>`).join('')}</ul></details>` : ''}${st.video ? `<video src="${st.video}" controls playsinline preload="none" style="display:block;width:100%;max-width:300px;margin-top:8px;border-radius:12px;background:#000"></video>` : ''}</div>
                        <span class="pill">${running ? 'NOW・' : (isNext ? 'NEXT・' : '')}${k.label}</span>
                    </div>`;
                }).join('');
                if (isToday) {
                    let cd = '';
                    const ri = sp.stops.findIndex((st, i) => nowMin0 >= ranges[i][0] && nowMin0 < ranges[i][1]);
                    const ni = sp.stops.findIndex((st, i) => nowMin0 < ranges[i][0]);
                    const fmt = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
                    if (ri >= 0 && sp.stops[ri].t.includes('〜')) {
                        const m = ranges[ri][1] - nowMin0;
                        cd = `${sp.stops[ri].label}は ${fmt(ranges[ri][1])} まで（あと ${m} 分）`;
                    } else if (ni >= 0) {
                        const m = ranges[ni][0] - nowMin0;
                        cd = `次：${sp.stops[ni].label}（${fmt(ranges[ni][0])}）まで あと ${m >= 60 ? Math.floor(m / 60) + ' 時間 ' : ''}${m % 60} 分`;
                    }
                    if (cd) html += `<div class="tile note full" ${delay(idx++)}><h3>${dot('NEXT', 11)}<span>${cd}</span></h3></div>`;
                }
                if (sp.weather) {
                    html += `<div class="tile note full" ${delay(idx++)}><h3>${dot('WEATHER', 11)}<span id="wx-line">${sp.weather.name}の天気を読み込み中…</span></h3></div>`;
                    loadWeather(sp.weather, dayInfo.dateStr);
                }
                html += `
                    <div class="tile cat c-event full" ${delay(idx++)}>
                        <div class="top"><div><div class="ttl" style="font-size:18px">${sp.title}</div><div class="tm" style="margin-top:3px;font-size:12.5px">${sp.sub || ''}</div></div><span class="pill">行事</span></div>
                        <div class="tlist">${rows}</div>
                    </div>`;
                if (sp.lodging) {
                    html += `
                    <div class="tile note full" ${delay(idx++)}>
                        <h3>${dot('HOTEL', 11)}<span>宿泊</span></h3>
                        <ul><li>${sp.lodging.name}${sp.lodging.map ? ` <a href="${sp.lodging.map}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline">Googleマップで開く ↗</a>` : ''}</li></ul>
                    </div>`;
                }
                container.innerHTML = html;
                return;
            }

            // 持ち物
            if (dayInfo.belongings.length > 0) {
                html += `
                    <div class="tile note full" ${delay(idx++)}>
                        <h3>${dot('ITEMS', 11)}<span>${dayWord}の持ち物・準備物</span></h3>
                        <ul>${dayInfo.belongings.map(i => `<li>${i}</li>`).join('')}</ul>
                    </div>`;
            }

            // 授業がない日
            if (!dayInfo.hasClass) {
                let cls = 'c-off', title = '学校休み', desc = `${dayWord}は学校が休みです。`, tag = 'OFF';
                if (dayInfo.holidayName) {
                    cls = 'c-holiday'; title = `祝日（${dayInfo.holidayName}）`; desc = `${dayWord}は祝日のため学校休みです。`; tag = 'HOLIDAY';
                } else if (dayInfo.statusType === 'winter_break') {
                    cls = 'c-winter'; title = '冬休み'; desc = '冬期休業期間中のため授業はありません。'; tag = 'WINTER';
                } else if (dayInfo.isWeekend) {
                    cls = 'c-none'; title = '週末休日'; desc = `${dayWord}は土日のため授業はありません。`; tag = 'WEEKEND';
                }
                html += `
                    <div class="tile off cat full ${cls}" ${delay(idx++)}>
                        <div><b>${title}</b><small>${desc}</small></div>
                        <span style="color:var(--c)">${dot(tag, 10)}</span>
                    </div>`;
                container.innerHTML = html;
                return;
            }

            const nowMin = now.getHours() * 60 + now.getMinutes();
            let nextShown = false;

            periods.forEach(p => {
                if (p.num === 'lunch') {
                    html += `<div class="tile lunch full" ${delay(idx++)}>${dot('LUNCH', 11)}${dot('12:00-12:50', 11)}</div>`;
                    return;
                }
                const ev = dayInfo.dayEvents.find(e => e.period === p.num);
                const [s, e] = periodRange(p);
                const timeDot = dot(p.time.replace('〜', '-'), 11);

                if (!ev) {
                    html += `
                        <div class="tile none ${isToday && nowMin >= e ? 'past' : ''}" ${delay(idx++)}>
                            <div class="top">${dot(String(p.num), 26)}</div>
                            <div class="ttl">授業なし</div>
                            <div class="tm">${timeDot}</div>
                        </div>`;
                    return;
                }

                const st = categoryStyles[ev.category] || categoryStyles.normal;
                const running = isToday && nowMin >= s && nowMin < e;
                const past = isToday && nowMin >= e;

                if (running) {
                    const total = e - s, done = nowMin - s;
                    const segs = 10;
                    const filled = Math.max(1, Math.round(done / total * segs));
                    html += `
                        <div class="tile hero span2 ${st.cls}" ${delay(idx++)}>
                            <div class="top">${dot('NOW', 11)}<span class="pill">${st.label}</span></div>
                            <div class="row">
                                <span style="color:#fff">${dot(String(p.num), 38)}</span>
                                <div><div class="ttl">${ev.title}</div><div class="tm" style="margin-top:5px">${timeDot}</div></div>
                            </div>
                            <div class="bar">${Array.from({ length: segs }, (_, i) => `<span class="${i < filled ? 'f' : ''}"></span>`).join('')}</div>
                            <div class="tm" style="font-size:12px">残り ${e - nowMin} 分</div>
                        </div>`;
                    return;
                }

                const isNext = isToday && !past && !nextShown;
                if (isNext) nextShown = true;
                html += `
                    <div class="tile cat ${st.cls} ${past ? 'past' : ''} ${isNext ? 'next' : ''}" ${delay(idx++)}>
                        <div class="top">${dot(String(p.num), 26)}<span class="pill">${isNext ? 'NEXT・' : ''}${st.label}</span></div>
                        <div class="ttl">${ev.title}</div>
                        <div class="tm">${timeDot}</div>
                    </div>`;
            });

            container.innerHTML = html;
        }

        // --- 10. 週別ビュー描画 ---
        function renderWeekly() {
            const monday = getMonday(currentDate);
            const sunday = new Date(monday);
            sunday.setDate(sunday.getDate() + 6);
            const thisWeek = isSameDay(monday, getMonday(new Date()));
            const f = d => `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
            el('date-display-title').innerHTML = dot(`${f(monday)} - ${f(sunday)}`, 22);
            el('date-sub').innerHTML = dot(thisWeek ? 'THIS WEEK' : 'WEEK', 10);

            const todayStr = formatDateStr(new Date());
            let html = '';
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(d.getDate() + i);
                const dStr = formatDateStr(d);
                const info = getDayInfo(d);
                const isToday = dStr === todayStr;

                let note = '';
                if (info.holidayName) note = info.holidayName;
                else if (info.statusType === 'winter_break') note = '冬休み';
                else if (info.statusType === 'school_off') note = '学校休み';
                else if (info.isWeekend && !info.hasClass) note = '休日';

                let body = '';
                if (info.special) {
                    body = info.special.stops.map(st => {
                        const k = kindStyles[st.kind] || kindStyles.move;
                        return `<div class="pr ${k.cls}"><span class="x" style="flex:none;min-width:84px;color:var(--g2)">${st.t.replace('〜', '-')}</span><span class="x">${st.label}</span></div>`;
                    }).join('');
                } else if (!info.hasClass) {
                    let msg = '授業なし';
                    if (info.holidayName) msg = `祝日（${info.holidayName}）`;
                    else if (info.statusType === 'winter_break') msg = '冬休み';
                    else if (info.statusType === 'school_off') msg = '学校休み';
                    else if (info.isWeekend) msg = '土日休校';
                    body = `<div class="empty">${msg}</div>`;
                } else {
                    body = periods.filter(p => p.num !== 'lunch').map(p => {
                        const ev = info.dayEvents.find(e => e.period === p.num);
                        if (!ev) return '';
                        const st = categoryStyles[ev.category] || categoryStyles.normal;
                        return `<div class="pr ${st.cls}"><span class="n">${dot(String(p.num), 14)}</span><span class="x">${ev.title}</span><span class="pill">${st.label}</span></div>`;
                    }).join('');
                }

                html += `
                    <div class="dcard ${isToday ? 'is-today' : ''} ${info.holidayName ? 'hol' : ''}" ${delay(i)}>
                        <div class="dh" onclick="jumpToDate('${dStr}')">
                            <div class="l">${dot(f(d), 14)}<b>（${getDayOfWeekStr(d)}）</b></div>
                            <div class="r">${isToday ? 'TODAY' + (note ? '・' : '') : ''}${note}</div>
                        </div>
                        <div class="dbody">${body}</div>
                    </div>`;
            }
            el('view-weekly').innerHTML = html;
        }

        // --- 11. 月別ビュー描画 ---
        function renderMonthly() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            el('date-display-title').innerHTML = dot(`${year}.${String(month + 1).padStart(2, '0')}`, 22);
            el('date-sub').innerHTML = dot('MONTH', 10);

            const startDow = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const todayStr = formatDateStr(new Date());
            let html = '';

            for (let i = 0; i < startDow; i++) html += `<div class="cell blank"></div>`;

            for (let day = 1; day <= totalDays; day++) {
                const dateObj = new Date(year, month, day);
                const info = getDayInfo(dateObj);
                const isToday = info.dateStr === todayStr;
                const cats = new Set(info.dayEvents.map(e => e.category));

                let tag = '';
                if (info.special) tag = ['c-event', '旅行'];
                else if (info.dayEvents.length > 0) {
                    if (cats.has('exam')) tag = ['c-exam', '試験'];
                    else if (cats.has('oral')) tag = ['c-oral', '口述'];
                    else if (cats.has('event')) tag = ['c-event', '行事'];
                    else tag = ['c-normal', '授業'];
                } else if (info.statusType === 'holiday') tag = ['c-holiday', '祝日'];
                else if (info.statusType === 'winter_break') tag = ['c-winter', '冬休'];
                else if (info.statusType === 'school_off') tag = ['c-off', '休み'];

                const dw = dateObj.getDay();
                html += `
                    <div class="cell ${isToday ? 'today' : ''} ${dw === 0 ? 'sun' : ''} ${dw === 6 ? 'sat' : ''} ${info.holidayName ? 'hol' : ''}" onclick="jumpToDate('${info.dateStr}')">
                        <div>${dot(String(day), 12)}</div>
                        ${tag ? `<span class="tag ${tag[0]}">${tag[1]}</span>` : '<span></span>'}
                    </div>`;
            }
            el('monthly-grid').innerHTML = html;
        }

        // 初期化実行
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });

        // 開きっぱなしで日付をまたいだときに「今日」の表示を更新する
        let lastRenderDay = formatDateStr(new Date());
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            const nowDay = formatDateStr(new Date());
            if (nowDay !== lastRenderDay) {
                lastRenderDay = nowDay;
                currentDate = new Date();
            }
            render();
        });

        // 授業中の「残り○分」を1分ごとに更新（今日の日別ビューを見ているときだけ）
        setInterval(() => {
            if (currentTab === 'daily' && isSameDay(currentDate, new Date())) renderDaily();
        }, 60000);

        // PWA:オフラインでも開けるように Service Worker を登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.warn('Service Worker の登録に失敗しました', err);
                });
            });
        }
    </script>
</body>
</html>
